# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
mizaniVersionName=1.0.0
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Handoff-2: KSP registers its generated dirs via the kotlin.sourceSets DSL, which AGP 9's
# built-in Kotlin rejects. (Handoff §3's builtInKotlin=false + kotlin-android 2.2.10 remedy fails:
# KGP 2.2.10 cannot cast AGP 9's extension to BaseExtension.) This AGP-recommended flag restores
# the legacy source-set behavior so KSP output is compiled.
android.disallowKotlinSourceSets=false
# Avoid selecting incomplete JREs bundled with IDE extensions (for example, VS Code's
# Java extension). Android Studio's bundled JDK above includes the jlink executable
# required by Android Gradle Plugin's JDK image transform.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=C\:\\Program Files\\Android\\Android Studio\\jbr
