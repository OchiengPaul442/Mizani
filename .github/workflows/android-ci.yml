name: 'Build & Tests'

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build debug APK and run JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            gradle/wrapper/gradle-wrapper.properties
            gradle/libs.versions.toml
            gradle.properties
            settings.gradle.kts
            build.gradle.kts
            app/build.gradle.kts

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      # This project's installed SDK uses the versioned API 37.0 package path.
      - name: Install Android 17 API 37.0 platform
        run: android sdk install --canary platforms/android-37.0

      - name: Build and test
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
